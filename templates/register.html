<!DOCTYPE html>
<html>

<head>
    <title>Register - GreenHabit</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>🌱 GreenHabit</h1>

    <h2>Create Account</h2>

    <form method="POST">

        <input type="text"
               name="name"
               placeholder="Enter your name"
               required>

        <br><br>

        <input type="email"
               name="email"
               placeholder="Enter your email"
               required>

        <br><br>

        <input type="password"
               name="password"
               placeholder="Enter password"
               required>

        <br><br>

        <button type="submit">Register</button>

    </form>

</body>

</html>
