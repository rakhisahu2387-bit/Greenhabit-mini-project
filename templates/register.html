<!DOCTYPE html>
<html>

<head>

    <title>Create Account - GreenHabit</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                🌱
            </div>

            <h1>GreenHabit</h1>

            <h2>Create Account</h2>

            <p class="subtitle">
                Start your sustainable journey today.
            </p>

            <form method="POST">

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p class="auth-link">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </div>

</body>

</html>
