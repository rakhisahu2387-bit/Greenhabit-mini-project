<!DOCTYPE html>
<html>

<head>

    <title>My Profile - GreenHabit</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="dashboard">

        <h1>🌱 GreenHabit</h1>

        <h2>👤 My Profile</h2>

        <div class="profile-card">

            <div class="profile-icon">
                🌱
            </div>

            <h2>{{ name }}</h2>

            <p>{{ email }}</p>

        </div>

        <div class="stats">

            <div class="stat-card">

                <h2>🌿</h2>

                <h3>{{ total_habits }}</h3>

                <p>My Habits</p>

            </div>

            <div class="stat-card">

                <h2>✅</h2>

                <h3>{{ total_completed }}</h3>

                <p>Total Completed</p>

            </div>

            <div class="stat-card">

                <h2>🔥</h2>

                <h3>{{ streak }}</h3>

                <p>Day Streak</p>

            </div>

        </div>

        <br>

        <a href="/dashboard">
            <button>Back to Dashboard</button>
        </a>

        <br><br>

        <a href="/logout">
            <button>Logout</button>
        </a>

    </div>

</body>

</html>
